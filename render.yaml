# Render Blueprint for the API (free plan). The web app is deployed separately on Vercel (apps/web/vercel.json).
services:
  - type: web
    name: ledgerlens-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build -w apps/server
    startCommand: npm run start -w apps/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Free key from https://aistudio.google.com (Get API key). Without it the app still works, rules only.
      - key: GEMINI_API_KEY
        sync: false
      # The Vercel URL of the web app, e.g. https://ledgerlens.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
